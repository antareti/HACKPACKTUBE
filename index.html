<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>HACKPACKTUBE | PRIVATE TERMINAL</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --neon-blue: #0088ff;
            --bg: #020205;
            --surface: #0a0e1a;
            --hot-red: #ff0044;
            --glow: 0 0 15px rgba(0, 136, 255, 0.4);
        }

        /* Оптимизация рендеринга */
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        
        body { 
            background: var(--bg); color: #c0d0ff; font-family: 'Segoe UI', sans-serif; 
            margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; 
        }

        /* 3D фоны - используем transform: translateZ(0) для ускорения GPU */
        .bg-shapes {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1; transform: translateZ(0);
        }

        .cube {
            position: absolute; width: 60px; height: 60px;
            border: 1px solid rgba(0, 136, 255, 0.1);
            animation: rotateCube 25s infinite linear;
            will-change: transform;
        }

        @keyframes rotateCube {
            from { transform: rotate(0deg) scale(1); }
            to { transform: rotate(360deg) scale(1.2); }
        }
        
        header { 
            height: 65px; background: var(--surface); border-bottom: 2px solid var(--neon-blue); 
            display: flex; align-items: center; justify-content: space-between; 
            padding: 0 25px; box-shadow: var(--glow); z-index: 1000; 
        }

        .wrapper { display: flex; flex: 1; overflow: hidden; }
        
        nav { width: 260px; background: var(--surface); border-right: 1px solid rgba(0, 136, 255, 0.1); z-index: 10; }
        .nav-link { padding: 15px 25px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; font-weight: 600; }
        .nav-link:hover, .nav-link.active { background: rgba(0, 136, 255, 0.1); color: var(--neon-blue); box-shadow: inset 4px 0 0 var(--neon-blue); }

        main { flex: 1; padding: 20px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        
        /* Grid-контейнер с оптимизацией */
        .grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 25px; contain: content;
        }

        /* 3D Шапка канала */
        .channel-info { display: none; margin-bottom: 30px; }
        .banner-3d { 
            height: 200px; width: 100%; background: #000; border-radius: 15px; 
            position: relative; overflow: hidden; border: 1px solid var(--neon-blue);
        }
        .grid-3d {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: linear-gradient(var(--neon-blue) 1px, transparent 1px), linear-gradient(90deg, var(--neon-blue) 1px, transparent 1px);
            background-size: 40px 40px; transform: rotateX(60deg); animation: moveGrid 10s linear infinite; opacity: 0.1;
            will-change: transform;
        }
        @keyframes moveGrid { from { transform: rotateX(60deg) translateY(0); } to { transform: rotateX(60deg) translateY(40px); } }
        
        .banner-content { position: absolute; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; z-index: 5; }
        .banner-title { font-size: clamp(30px, 5vw, 50px); font-weight: 900; color: #fff; letter-spacing: 10px; text-shadow: 0 0 20px var(--neon-blue); }

        /* Карточки видео - используем content-visibility для скорости */
        .v-card { 
            cursor: pointer; position: relative; transition: 0.3s;
            content-visibility: auto; contain-intrinsic-size: 200px;
        }
        .v-card:hover { transform: scale(1.03); }
        .v-thumb { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; 
            border: 1px solid #222; overflow: hidden; position: relative;
        }
        .v-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .v-title { margin-top: 10px; font-size: 14px; font-weight: bold; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        .badge-18 { position: absolute; bottom: 8px; right: 8px; background: var(--hot-red); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; z-index: 5; }

        /* PLAYER OVERLAY */
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; backdrop-filter: blur(10px); }
        .player-wrapper { width: 90%; max-width: 900px; aspect-ratio: 16/9; border: 2px solid var(--neon-blue); background: #000; box-shadow: 0 0 40px rgba(0,136,255,0.3); }
        iframe { width: 100%; height: 100%; border: none; }
        .close-btn { margin-bottom: 10px; color: var(--neon-blue); cursor: pointer; font-size: 16px; font-weight: bold; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="bg-shapes" id="bg-layer"></div>

    <header>
        <div class="logo" onclick="toggleView('home')">HACKPACKTUBE</div>
        <div style="color:var(--hot-red); font-weight:bold; font-size: 13px;"><i class="fas fa-microchip"></i> SYSTEM: OPTIMIZED</div>
    </header>

    <div class="wrapper">
        <nav>
            <div class="nav-link active" id="nav-home" onclick="toggleView('home')"><i class="fas fa-th-large"></i> Главная</div>
            <div class="nav-link" id="nav-chan" onclick="toggleView('chan')"><i class="fas fa-user-shield"></i> Мой канал (+18)</div>
        </nav>

        <main id="main-scroll">
            <div id="channel-header" class="channel-info">
                <div class="banner-3d">
                    <div class="grid-3d"></div>
                    <div class="banner-content"><div class="banner-title">BITSNIFFER</div></div>
                </div>
            </div>
            <div class="grid" id="main-grid"></div>
        </main>
    </div>

    <div id="overlay">
        <div class="close-btn" onclick="closePlayer()">[ CLOSE X ]</div>
        <div class="player-wrapper" id="player-container"></div>
    </div>

    <script>
        const config = { homeCount: 1500, chanCount: 500 };
        
        const homeVideos = [
            {id:'dQw4w9WgXcQ', t:'System Update 2.0'}, {id:'jfKfPfyJRdk', t:'Global Traffic'},
            {id:'kJQP7kiw5Fk', t:'AI Report'}, {id:'V-_O7nl0Ii0', t:'Cyber 2026'},
            {id:'y6120QOlsfU', t:'Data Flow'}, {id:'_u7Md_glvYQ', t:'Darknet Archives'}
        ];

        const chanVideos = [
            {id:'p_8_vN7rX60', t:'PRIVATE: Neon', x:true, thumb:'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?w=400'},
            {id:'r6-N-pW3t_M', t:'RESTRICTED: Pulse', x:true, thumb:'https://images.unsplash.com/photo-1514525253344-99a6d30086bb?w=400'},
            {id:'h7GyMId8oXY', t:'VIP: Forbidden', x:true, thumb:'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=400'},
            {id:'6RtTyWFAgO8', t:'UNCENSORED: Vibes', x:true, thumb:'https://images.unsplash.com/photo-1595760780346-f972eb49709f?w=400'}
        ];

        function toggleView(mode) {
            const grid = document.getElementById('main-grid');
            const head = document.getElementById('channel-header');
            const mainScroll = document.getElementById('main-scroll');
            
            grid.innerHTML = '';
            mainScroll.scrollTop = 0;
            
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));

            if(mode === 'home') {
                head.style.display = 'none';
                document.getElementById('nav-home').classList.add('active');
                renderBatch(grid, homeVideos, config.homeCount);
            } else {
                head.style.display = 'block';
                document.getElementById('nav-chan').classList.add('active');
                renderBatch(grid, chanVideos, config.chanCount);
            }
        }

        // Оптимизированный рендеринг через фрагменты
        function renderBatch(container, data, count) {
            const fragment = document.createDocumentFragment();
            for(let i=0; i<count; i++) {
                const v = data[i % data.length];
                const card = document.createElement('div');
                card.className = 'v-card';
                card.onclick = () => playVideo(v.id);
                
                const thumb = v.thumb ? v.thumb : `https://img.youtube.com/vi/${v.id}/mqdefault.jpg`;
                
                card.innerHTML = `
                    <div class="v-thumb">
                        <img src="${thumb}" loading="lazy">
                        ${v.x ? '<div class="badge-18">18+</div>' : ''}
                    </div>
                    <div class="v-title">${v.t} #${i+1}</div>
                `;
                fragment.appendChild(card);
                
                // Чтобы не вешать браузер, отрисовываем пачками по 100
                if (i % 100 === 0 && i !== 0) {
                    container.appendChild(fragment);
                }
            }
            container.appendChild(fragment);
        }

        function playVideo(id) {
            document.getElementById('player-container').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            document.getElementById('overlay').style.display = 'flex';
        }

        function closePlayer() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('player-container').innerHTML = '';
        }

        // Создаем фоновые фигуры один раз
        window.onload = () => {
            const bg = document.getElementById('bg-layer');
            for(let i=0; i<5; i++) {
                const c = document.createElement('div');
                c.className = 'cube';
                c.style.left = Math.random() * 90 + '%';
                c.style.top = Math.random() * 90 + '%';
                c.style.animationDelay = (i * -2) + 's';
                bg.appendChild(c);
            }
            toggleView('home');
        };
    </script>
</body>
</html>
